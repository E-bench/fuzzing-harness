# ExpansionHunter v5.0.0 (the original, side a) against NuExpansionHunter (the rewrite, side b).
name = "eh-nueh"
title = "ExpansionHunter v5.0.0 vs NuExpansionHunter"

[side.a]
name = "eh"
title = "ExpansionHunter v5.0.0"
repo = "https://github.com/Illumina/ExpansionHunter"
commit = "9f5db1d4ab72016b2d93330b9792842d71582622"      # tag v5.0.0
# temporary patches that hide known bugs of the original, so that fuzzing goes on behind them (bugs/<name>/README.md)
patches = ["patches/eh-0001-worker-thread-exceptions.diff", "patches/eh-0002-genome-mask-negative-contig.diff",
           "patches/eh-0003-release-queue-after-exception.diff", "patches/eh-0004-bamlet-writer-constructor.diff",
           "patches/eh-0005-variant-id-count.diff", "patches/eh-0006-fragment-origins-overflow.diff"]

[side.b]
name = "nueh"
title = "NuExpansionHunter"
repo = "https://github.com/BioCode-Commons/NuExpansionHunter"
commit = "96bdca4e854e3e4bd6c04f3cf211c633079f08d5"      # main, 2026-11-21
patches = ["patches/nueh-0001-empty-catalog-memcpy.diff", "patches/nueh-0002-variant-id-count.diff",
           "patches/nueh-0003-fragment-origins-overflow.diff"]

[build]
deps = "bash {target}/build.sh deps {side} {src} {deps}"
program = "bash {target}/build.sh program {side} {src} {deps} {build} {out}"
data = "python3 -I {target}/make_data.py {bin}/dfz_tool {data} {seeds}"
adapter = "adapter.cpp"
harness_libs = "-lz"                # the adapter writes and reads BGZF
ref = { cc = "gcc", cxx = "g++" }   # both projects document GCC; equal floating-point results need the same compiler
# Sanitizer builds without the alignment check: htslib's helpers access integers through a type it declares as
# unaligned (hts_endian.h), clang's sanitizer reports that all the same, and the rewrite's own code uses the helpers
# on almost every run (README.md, notes).
san_flags = "-fno-sanitize=alignment"

[run]
# One command line for both programs. {in}: the case's input directory, {out}: this side's output directory,
# {data}: the target's fixed data. The adapter may append options per case (see adapter.cpp).
argv = ["--reads", "{in}/reads{reads_ext}", "--reference", "{in}/ref.fa", "--variant-catalog", "{in}/catalog.json",
        "--output-prefix", "{out}/r", "--analysis-mode", "streaming"]
timeout_ms = 20000
# Resident memory of one run: six times what the largest seed needs (174 MB, the original on a catalog of 2,200
# loci; its longest run takes 5.2 s). What passes this limit is a program allocating without bound (README.md,
# limits). A campaign job needs this much memory per CPU.
memory_mb = 1024
# Campaigns fuzz on the builds with sanitizers (flavour fuzzsan; SAN=0 on a campaign's command line takes the plain
# ones). On those builds the limits are multiplied: measured on the seeds, the original needs up to 7 times the
# time and memory of its plain build.
sanitizers = true
san_slower = 5
san_larger = 4
# Sanitizer checks left out at run time. Leaks: memory still held when a program ends is not looked for; no run
# with the leak check has been made (README.md, notes).
asan_options = "detect_leaks=0"
exit = "class"                      # ok / error exit / signal / timeout must agree; exit codes are not compared
error_line = "last"                 # a failed run's last output line goes into the signature (digits and paths masked)
error_strip = "^[0-9T:,-]+|^terminate called.*|^ *what\\(\\): *"   # log time stamps and the C++ runtime's abort banner
output = [
  { file = "r.vcf", compare = "tsv", options = ";:" },
  { file = "r.json", compare = "json" },
  { file = "r_realigned.bam", compare = "lines" },   # the adapter turns it into sorted text records first
]

[adapter]
rewrite_options = 1                 # also pass the rewrite's own options (codec threads, queue budget, catalog cache)
rewrite_option_errors = 0           # 1: also invalid uses of them (the programs then differ by design: tag rewrite-option-error, removed in dfz_compare)
base_cases = 6                      # base cases under {data}/base for the raw surfaces (make_data.py)
# Input constraints (README.md, "Input constraints"): shapes of input the original does not define and on which the
# programs differed. The generator leaves them out unless they are switched on here.
inverted_regions = 0                # 1: also write regions with start > end (cases get the tag inverted-region)
invalid_reads_files = 0             # 1: also SAM text without @SQ lines, read names over 254 characters
negative_extension = 0              # 1: also --region-extension-length -5 (cases get the tag ext-5); 0: 5 in its place
# Not a constraint, a choice of range (README.md, "Notes on both programs"):

# Surfaces: what the fuzz input means (decoded in adapter.cpp).
[surface.locus]                     # structured: genome, catalog, simulated sample, options
max_len = 176                       # header 16 + 4 loci x 16 + 12 extra records x 8
min_len = 32

[surface.catalog]                   # the input is catalog.json
max_len = 4096
dict = "dict/catalog.dict"

[surface.sam]                       # the input is the reads file, SAM text
max_len = 32768
dict = "dict/sam.dict"

[surface.bam]                       # the input is the reads file, uncompressed BAM (BGZF is added by the adapter)
max_len = 32768

[coverage]
# not the programs under test: dependencies, system headers, unit tests, third-party code other than graph-tools
# (graph-tools holds the alignment code that the rewrite replaced, so it stays in)
ignore = "/deps/|/usr/|/opt/|/spack/|Test\\.cpp$|/tests/|/verification/|/thirdparty/(ctpl|intervaltree|json)/|/graph-tools-master-f421f4c/(external|tests)/"

unreachable = "unreachable.tsv"     # branch outcomes that streaming mode and the release build cannot produce (UNREACHABLE.md)

[[coverage.out_of_scope]]
match = "/sample/(HtsSeekingSampleAnalysis|HtsFileSeeker|MateExtractor|IndexBasedDepthEstimate)\\."
reason = "seeking mode (the command line in [run] selects streaming)"
